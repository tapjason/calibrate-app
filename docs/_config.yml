# GitHub Pages project site for tapjason/calibrate-app.
# Source: branch master, folder /docs.
# The built files are served at https://tapjason.github.io/calibrate-app/
# Permalinks are site-root paths. Do not put /calibrate-app in a permalink;
# that prefix is the project site, not part of the file path.
title: Fairly Sure
url: https://tapjason.github.io
baseurl: /calibrate-app
# Primer is the Pages default. Turn it off so this site is only the layout
# below, not a theme that lists every page.
theme: null
markdown: kramdown
kramdown:
  input: GFM
  # Keep the policy's quotes as typed. The default turns them into curly quotes.
  smart_quotes: apos,apos,quot,quot

# Pages runs Jekyll with optional front matter, so every Markdown file would
# become a public page, and Liquid-looking braces in the research notes would
# fail the build. Publish the privacy policy, the support page and the short
# index only.
# `include` wins over `exclude` (Jekyll 3.10 EntryFilter).
exclude:
  - design
  - "*.md"
  - ACCOUNT_SPEC.md
  - APP_PRIVACY.md
  - APP_STORE_LISTING.md
  - CALIBRATION.md
  - HUMAN_VERIFICATION.md
  - NEXT_STEPS.md
include:
  - index.md
  - PRIVACY_POLICY.md
  - SUPPORT.md

defaults:
  - scope:
      path: ""
    values:
      layout: default
